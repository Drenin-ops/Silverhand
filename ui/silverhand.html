<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILVERHAND — ASSISTANT AI</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Bebas+Neue&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red:          #c0392b;
    --red-bright:   #e74c3c;
    --red-dim:      #7b1f1a;
    --red-glow:     rgba(192,57,43,0.35);
    --dark:         #0a0a0a;
    --panel:        rgba(10,10,10,0.88);
    --panel-border: rgba(192,57,43,0.4);
    --text:         #d0ccc8;
    --text-dim:     #7a7570;
    /*
      Spritesheet: 1536x1024 — 6 cells at 512x512
      Displayed at 480x480 (scale 0.9375)
      Scaled sheet: 1440x960

      Col 0       Col 1       Col 2
      listening   speaking    grin      ← row 0 (y=0)
      laugh       frown       intense   ← row 1 (y=-480)
    */
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:var(--dark);
    font-family:'Rajdhani',sans-serif;
    color:var(--text);
    overflow:hidden;
    user-select:none;
  }

  /* scanlines */
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:1000;
    background:repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px
    );
  }

  /* ── PORTRAIT (spritesheet) ── */
  /*
    Spritesheet is 1536x1024 — 3 cols x 2 rows, each cell 512x512.
    We display the portrait filling the full viewport height minus the titlebar (50px).
    Cell display size = (vh - 50px). Sheet display = 3x wide, 2x tall.
    CSS custom properties updated by JS on resize.
  */
  #portrait {
    position:fixed; left:-40px; top:50px;
    width:var(--cell-size, 100vh); height:calc(100vh - 50px);
    background-image:url('/assets/johnny_states.png');
    background-size:var(--sheet-w, 300vh) var(--sheet-h, 200vh);
    background-repeat:no-repeat;
    background-position:0px 0px;
    z-index:2;
    mask-image:linear-gradient(to right,black 48%,transparent 88%);
    -webkit-mask-image:linear-gradient(to right,black 48%,transparent 88%);
    filter:brightness(0.70) contrast(1.10) saturate(0.65);
    transition:
      background-position 0.38s cubic-bezier(0.4,0,0.2,1),
      filter 0.42s ease;
  }

  body.state-idle      #portrait { background-position:var(--p00); filter:brightness(0.70) contrast(1.10) saturate(0.65); }
  body.state-listening #portrait { background-position:var(--p00); filter:brightness(0.86) contrast(1.08) saturate(0.80); }
  body.state-speaking  #portrait { background-position:var(--p10); filter:brightness(0.92) contrast(1.12) saturate(0.90); }
  body.state-grin      #portrait { background-position:var(--p20); filter:brightness(0.96) contrast(1.15) saturate(1.00); }
  body.state-smirk     #portrait { background-position:var(--p20); filter:brightness(0.96) contrast(1.15) saturate(1.00); }
  body.state-laugh     #portrait { background-position:var(--p01); filter:brightness(1.00) contrast(1.20) saturate(1.05); }
  body.state-frown     #portrait { background-position:var(--p11); filter:brightness(0.64) contrast(1.32) saturate(0.52); }
  body.state-scoff     #portrait { background-position:var(--p11); filter:brightness(0.64) contrast(1.32) saturate(0.52); }
  body.state-intense   #portrait { background-position:var(--p21); filter:brightness(0.74) contrast(1.38) saturate(0.68); }

  @keyframes glitch {
    0%  {clip-path:inset(22% 0 58% 0);transform:translate(-3px,0);}
    25% {clip-path:inset(58% 0 12% 0);transform:translate( 3px,0);}
    50% {clip-path:inset(8%  0 78% 0);transform:translate(-2px,0);}
    75% {clip-path:inset(72% 0  4% 0);transform:translate( 2px,0);}
    100%{clip-path:inset(22% 0 58% 0);transform:translate( 0px,0);}
  }
  body.state-laugh #logo { animation:glitch 0.12s steps(1) 4; }

  /* ── QUOTE ── */
  #quote-panel {
    position:fixed; left:20px; top:70px; width:208px; z-index:10;
    opacity:0; transform:translateX(-8px);
    transition:opacity 0.5s ease,transform 0.5s ease;
  }
  #quote-panel.visible { opacity:1; transform:translateX(0); }
  #quote-text {
    font-family:'Share Tech Mono',monospace; font-size:11.5px;
    color:var(--red-bright); line-height:1.6; text-transform:uppercase;
    letter-spacing:0.02em; border-left:2px solid var(--red);
    padding-left:10px; margin-bottom:7px;
  }
  #quote-attr {
    font-family:'Share Tech Mono',monospace; font-size:9.5px;
    color:var(--red-dim); text-transform:uppercase;
    letter-spacing:0.08em; padding-left:10px;
  }

  /* ── TITLEBAR ── */
  #titlebar {
    position:fixed; top:0; left:0; right:0; height:50px;
    background:rgba(4,4,4,0.97); border-bottom:1px solid var(--panel-border);
    display:flex; align-items:center; padding:0 16px; z-index:100;
  }
  #logo {
    font-family:'Bebas Neue',sans-serif; font-size:27px;
    letter-spacing:0.12em; color:var(--red-bright);
    text-shadow:0 0 18px var(--red-glow); margin-right:10px;
  }
  #logo-sub {
    font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:500;
    letter-spacing:0.26em; color:var(--text-dim); text-transform:uppercase; margin-top:3px;
  }
  #titlebar-right { margin-left:auto; display:flex; align-items:center; gap:18px; }
  #model-tag {
    font-family:'Share Tech Mono',monospace; font-size:10px;
    color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em;
  }
  #model-tag span { color:var(--red); }

  /* WS status pill */
  #ws-status {
    font-family:'Share Tech Mono',monospace; font-size:9px;
    letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 8px; border:1px solid rgba(192,57,43,0.3);
    color:var(--text-dim); transition:color 0.3s, border-color 0.3s;
  }
  #ws-status.connected { color:#27ae60; border-color:rgba(39,174,96,0.4); }
  #ws-status.disconnected { color:var(--red); border-color:rgba(192,57,43,0.5); }

  #status-dot {
    width:8px; height:8px; border-radius:50%;
    background:var(--red); box-shadow:0 0 8px var(--red-glow);
    transition:background 0.3s,box-shadow 0.3s;
  }
  body.state-listening #status-dot { background:#e74c3c; box-shadow:0 0 14px rgba(231,76,60,0.8); animation:pdot 1s ease-in-out infinite; }
  body.state-speaking  #status-dot { background:#f39c12; box-shadow:0 0 14px rgba(243,156,18,0.8); animation:pdot 0.55s ease-in-out infinite; }
  @keyframes pdot { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.45);opacity:0.55;} }

  /* ── MAIN PANEL ── */
  #main-panel {
    position:fixed; right:0; top:50px; bottom:0;
    width:min(460px, 48vw); min-width:320px;
    background:var(--panel); border-left:1px solid var(--panel-border);
    display:flex; flex-direction:column; z-index:5;
  }

  /* ── GREETING ── */
  #greeting-section { padding:20px 22px 0; flex-shrink:0; }
  #greeting {
    font-family:'Orbitron',sans-serif; font-size:clamp(22px,3.5vw,38px); font-weight:900;
    color:#fff; letter-spacing:0.05em; line-height:1; margin-bottom:5px;
  }
  #greeting .cursor {
    display:inline-block; width:3px; height:32px;
    background:var(--red-bright); vertical-align:middle; margin-left:2px;
    animation:blink 1.1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
  #greeting-sub {
    font-family:'Rajdhani',sans-serif; font-size:14px;
    color:var(--text-dim); letter-spacing:0.04em; margin-bottom:18px;
  }

  /* ── CONVERSATION ── */
  #conversation {
    flex:1; overflow-y:auto; padding:14px 18px;
    display:flex; flex-direction:column; gap:11px;
    scrollbar-width:thin; scrollbar-color:var(--red-dim) transparent;
  }
  #conversation::-webkit-scrollbar { width:3px; }
  #conversation::-webkit-scrollbar-thumb { background:var(--red-dim); border-radius:2px; }

  #quick-actions { display:flex; flex-direction:column; gap:8px; transition:opacity 0.4s ease; }
  #quick-actions.hidden { opacity:0; pointer-events:none; }
  .quick-btn {
    display:flex; align-items:center; gap:12px; padding:10px 15px;
    background:transparent; border:1px solid rgba(192,57,43,0.22);
    color:var(--text); font-family:'Rajdhani',sans-serif;
    font-size:15px; font-weight:500; letter-spacing:0.04em;
    cursor:pointer; text-align:left;
    transition:border-color 0.2s,background 0.2s,color 0.2s;
  }
  .quick-btn:hover { border-color:var(--red); background:rgba(192,57,43,0.08); color:#fff; }
  .quick-btn svg { flex-shrink:0; opacity:0.55; }

  .msg { display:flex; flex-direction:column; gap:3px; animation:msgin 0.3s ease; }
  @keyframes msgin { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:translateY(0);} }
  .msg-label { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); }
  .msg-label.johnny { color:var(--red); }
  .msg-body {
    font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:500;
    line-height:1.55; color:var(--text); padding:9px 13px;
    background:rgba(255,255,255,0.028); border-left:2px solid rgba(255,255,255,0.07);
  }
  .msg-body.johnny { background:rgba(192,57,43,0.07); border-left:2px solid var(--red-dim); color:#e8e4e0; }
  .typewriter-cursor::after { content:'▮'; color:var(--red); animation:blink 0.7s step-end infinite; }
  .emotion-badge {
    display:inline-block; font-family:'Share Tech Mono',monospace;
    font-size:9.5px; color:var(--red); letter-spacing:0.1em;
    text-transform:uppercase; margin-bottom:3px; opacity:0.75;
  }

  /* ── BOTTOM BAR ── */
  #bottom-bar {
    flex-shrink:0; border-top:1px solid var(--panel-border);
    padding:11px 16px 9px; background:rgba(4,4,4,0.6);
  }
  #input-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  #text-input {
    flex:1; background:transparent; border:none;
    border-bottom:1px solid rgba(192,57,43,0.28);
    color:var(--text); font-family:'Rajdhani',sans-serif;
    font-size:15px; font-weight:500; padding:5px 2px; outline:none;
    transition:border-color 0.2s;
  }
  #text-input:focus { border-color:var(--red); }
  #text-input::placeholder { color:var(--text-dim); font-style:italic; }
  #text-input:disabled { opacity:0.35; cursor:not-allowed; }

  #waveform { display:flex; align-items:center; gap:2px; height:24px; flex-shrink:0; }
  .wave-bar { width:3px; background:var(--red); border-radius:2px; height:4px; opacity:0.3; }
  body.state-listening .wave-bar { animation:wlisten 0.75s ease-in-out infinite; opacity:0.9; }
  body.state-speaking  .wave-bar { animation:wspeak  0.38s ease-in-out infinite; opacity:1.0; }
  .wave-bar:nth-child(1){animation-delay:0.00s;} .wave-bar:nth-child(2){animation-delay:0.10s;}
  .wave-bar:nth-child(3){animation-delay:0.20s;} .wave-bar:nth-child(4){animation-delay:0.15s;}
  .wave-bar:nth-child(5){animation-delay:0.05s;} .wave-bar:nth-child(6){animation-delay:0.25s;}
  .wave-bar:nth-child(7){animation-delay:0.10s;} .wave-bar:nth-child(8){animation-delay:0.20s;}
  @keyframes wlisten { 0%,100%{height:4px;} 50%{height:18px;} }
  @keyframes wspeak  { 0%,100%{height:6px;} 50%{height:21px;} }

  #status-bar { display:flex; align-items:center; justify-content:space-between; }
  #status-label { font-family:'Share Tech Mono',monospace; font-size:8.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; }
  #mode-label   { font-family:'Share Tech Mono',monospace; font-size:8.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; }
  #mode-label span { color:var(--red); }

  /* ── SAMURAI BADGE ── */
  #samurai-badge { position:fixed; left:14px; bottom:14px; z-index:10; opacity:0.65; }
  #samurai-title { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:0.3em; color:var(--red-dim); line-height:1; margin-bottom:2px; }
  #samurai-sub   { font-family:'Share Tech Mono',monospace; font-size:8.5px; color:var(--red-dim); text-transform:uppercase; letter-spacing:0.07em; opacity:0.55; margin-bottom:5px; }
  #barcode       { display:flex; gap:1px; align-items:flex-end; height:16px; margin-bottom:3px; }
  .bc            { background:var(--red-dim); }
  #samurai-num   { font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--red-dim); opacity:0.45; letter-spacing:0.1em; }

  /* ── RECONNECT BANNER ── */
  #reconnect-banner {
    display:none; position:fixed; top:50px; left:0; right:0;
    background:rgba(192,57,43,0.15); border-bottom:1px solid var(--panel-border);
    font-family:'Share Tech Mono',monospace; font-size:11px;
    color:var(--red-bright); text-transform:uppercase; letter-spacing:0.1em;
    padding:8px 16px; text-align:center; z-index:50;
  }
  #reconnect-banner.show { display:block; }

  /* ── PARTICLE FACE replaces the spritesheet portrait ── */
  #portrait { display:none !important; }
  #particle-face { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
</style>
</head>
<body class="state-idle">

<canvas id="particle-face"></canvas>

<div id="titlebar">
  <div id="logo">SILVERHAND</div>
  <div id="logo-sub">ASSISTANT AI</div>
  <div id="titlebar-right">
    <div id="model-tag">MODEL: <span>SAMURAI-ENGRAM V1.0</span></div>
    <div id="ws-status" class="disconnected">OFFLINE</div>
    <div id="status-dot"></div>

<div id="reconnect-banner">Connection lost — reconnecting...</div>

<div id="portrait"></div>

<div id="samurai-badge">
  <div id="samurai-title">SAMURAI</div>

</div>

  <div id="quote-text"></div>

</div>

<div id="main-panel">
  <div id="greeting-section">
    <div id="greeting">HEY, <span id="user-name">V</span><span class="cursor"></span></div>

  <div id="bottom-bar">

        onkeydown="if(event.key==='Enter')sendText()" disabled>

        <div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>

      </div>
    </div>

<script src="/assets/particle-face.js"></script>
<script>
// ── PARTICLE FACE: boot (Johnny's red/glitch profile, starts idle) ──
ParticleFace.init({ count: 2600, style: 'johnny' });

// ── BARCODE ───────────────────────────────────────────────────────────────────
(function(){
  const bc = document.getElementById('barcode');
  [2,1,3,1,2,1,1,3,2,1,2,1,3,2,1,1,2,3,1,2,1,3,1,2].forEach(w => {
    const b = document.createElement('div');
    b.className = 'bc';
    b.style.cssText = `width:${w}px;height:${Math.round(Math.random()*4+11)}px;`;
    bc.appendChild(b);
  });
})();

// ── SPRITESHEET POSITION CALCULATOR ──────────────────────────────────────────
// The spritesheet is 3 cols x 2 rows. Each cell = (viewport height - 50px).
// We recalculate on every resize so the portrait always fills the window.
function updateSpritePositions() {
  const cell = window.innerHeight - 50;   // height of one sprite cell in display px
  const root = document.documentElement;

  // Sheet dimensions
  root.style.setProperty('--cell-size', cell + 'px');
  root.style.setProperty('--sheet-w',   (cell * 3) + 'px');
  root.style.setProperty('--sheet-h',   (cell * 2) + 'px');

  // Grid positions: col offset = -col*cell, row offset = -row*cell
  // col0=listening/idle  col1=speaking  col2=grin
  // row0=top             row1=laugh/frown/intense
  root.style.setProperty('--p00', `0px 0px`);                            // listening/idle
  root.style.setProperty('--p10', `-${cell}px 0px`);                     // speaking
  root.style.setProperty('--p20', `-${cell*2}px 0px`);                   // grin/smirk
  root.style.setProperty('--p01', `0px -${cell}px`);                     // laugh
  root.style.setProperty('--p11', `-${cell}px -${cell}px`);              // frown/scoff
  root.style.setProperty('--p21', `-${cell*2}px -${cell}px`);            // intense
}

updateSpritePositions();
window.addEventListener('resize', updateSpritePositions);

// ── WEBSOCKET ─────────────────────────────────────────────────────────────────
const WS_URL    = 'ws://127.0.0.1:7477/ws';
const wsStatus  = document.getElementById('ws-status');
const banner    = document.getElementById('reconnect-banner');
const textInput = document.getElementById('text-input');
let ws          = null;
let reconnTimer = null;

function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    wsStatus.textContent = 'ONLINE';
    wsStatus.className   = 'connected';
    banner.classList.remove('show');
    textInput.disabled   = false;
    console.log('[ws] connected');
    // Ask server to re-send name in case we just reconnected
    wsSend({ type: 'request_name' });
  };

  ws.onmessage = (e) => {
    try { handleEvent(JSON.parse(e.data)); }
    catch(err) { console.error('[ws] parse error', err); }
  };

  ws.onclose = () => {
    wsStatus.textContent = 'OFFLINE';
    wsStatus.className   = 'disconnected';
    banner.classList.add('show');
    textInput.disabled   = true;
    // auto-reconnect every 2s
    clearTimeout(reconnTimer);
    reconnTimer = setTimeout(connectWS, 2000);
  };

  ws.onerror = () => ws.close();
}

connectWS();

function wsSend(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ── NAME ──────────────────────────────────────────────────────────────────────
let userName = 'V';
function setUserName(name) {
  if (!name || !name.trim()) return;
  userName = name.trim();
  document.getElementById('user-name').textContent =
    (userName.charAt(0).toUpperCase() + userName.slice(1)).toUpperCase();
}

// ── QUOTES ────────────────────────────────────────────────────────────────────
const QUOTES = {
  idle:     ['"Heh. You got some balls, I like that."',
             '"World\'s gone to shit. Business as usual."',
             '"Take it easy. The world won\'t burn... yet."'],
  listening:['"I\'m listening. Doesn\'t mean I agree."',
             '"Go ahead. I\'ve heard worse."'],
  speaking: ['"Here\'s the situation, whether you like it or not."',
             '"Pay attention. I won\'t repeat myself."'],
  grin:     ['"Ha. Now that\'s what I\'m talking about."',
             '"Finally, something worth my time."'],
  smirk:    ['"Heh. You got some balls."', '"Look at you."'],
  laugh:    ['"Ha! You\'re fuckin\' hilarious."',
             '"Now THAT\'s funny. Don\'t thank me."'],
  frown:    ['"Tch. Figures."', '"Nobody ever said this would be easy."'],
  scoff:    ['"Tch. Figures."', '"You sure about that?"'],
  intense:  ['"Listen close. This is important."', '"Don\'t fuck it up."'],
};
let qTimer = null;
function showQuote(state) {
  const panel = document.getElementById('quote-panel');
  const el    = document.getElementById('quote-text');
  const pool  = QUOTES[state] || QUOTES.idle;
  panel.classList.remove('visible');
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    el.textContent = pool[Math.floor(Math.random() * pool.length)];
    panel.classList.add('visible');
  }, 130);
}

// ── STATES ────────────────────────────────────────────────────────────────────
const ALIASES = {
  chuckle:'laugh', snort:'laugh',
  sigh:'frown', 'eye roll':'frown', 'eye-roll':'frown',
  'hard stare':'intense', stare:'intense', serious:'intense',
};
function setState(raw) {
  const s = ALIASES[raw.toLowerCase()] || raw.toLowerCase();
  document.body.className = 'state-' + s;
  showQuote(s);
  if (window.ParticleFace) ParticleFace.setExpression(s);  // drive the particle face
}

// ── CONVERSATION ──────────────────────────────────────────────────────────────
const conv   = document.getElementById('conversation');
const quickA = document.getElementById('quick-actions');
let quickHidden = false;

function hideQuick() {
  if (quickHidden) return;
  quickHidden = true;
  quickA.classList.add('hidden');
  setTimeout(() => { quickA.style.display = 'none'; }, 420);
}

function addMsg(role, text, emotion) {
  hideQuick();
  const wrap  = document.createElement('div'); wrap.className = 'msg';
  const label = document.createElement('div');
  label.className = 'msg-label' + (role === 'johnny' ? ' johnny' : '');
  label.textContent = role === 'johnny' ? '// JOHNNY' : '// ' + userName.toUpperCase();
  wrap.appendChild(label);
  if (emotion) {
    const badge = document.createElement('div');
    badge.className = 'emotion-badge';
    badge.textContent = '*' + emotion + '*';
    wrap.appendChild(badge);
  }
  const body = document.createElement('div');
  body.className = 'msg-body' + (role === 'johnny' ? ' johnny' : '');
  if (text) body.textContent = text;
  wrap.appendChild(body);
  conv.appendChild(wrap);
  conv.scrollTop = conv.scrollHeight;
  return body;
}

function typewriter(el, text, speed, cb) {
  el.classList.add('typewriter-cursor');
  let i = 0;
  const iv = setInterval(() => {
    el.textContent += text[i++];
    conv.scrollTop = conv.scrollHeight;
    if (i >= text.length) {
      clearInterval(iv);
      el.classList.remove('typewriter-cursor');
      if (cb) cb();
    }
  }, speed);
}

// ── EMOTION ───────────────────────────────────────────────────────────────────
const EMOTION_RE = [
  [/\*(grin)\*/i,                             'grin'],
  [/\*(smirk)\*/i,                            'smirk'],
  [/\*(laugh|chuckle|snort)\*/i,              'laugh'],
  [/\*(frown|scoff|sigh|eye.?roll)\*/i,       'frown'],
  [/\*(intense|serious|hard.?stare|stare)\*/i,'intense'],
];
function detectEmotion(text) {
  for (const [re,s] of EMOTION_RE) if (re.test(text)) return s;
  return null;
}
function stripTags(text) { return text.replace(/\*[^*]+\*/g,'').replace(/\s{2,}/g,' ').trim(); }

// ── EVENT HANDLER ─────────────────────────────────────────────────────────────
function handleEvent(e) {
  switch(e.type) {
    case 'set_name':       setUserName(e.name); break;
    case 'listening':      setState('listening'); break;
    case 'user_input':     setState('idle'); addMsg('user', e.text, null); break;
    case 'thinking':       setState('idle'); break;
    case 'response_start': setState('speaking'); break;
    case 'response': {
      const emo  = detectEmotion(e.text);
      const text = stripTags(e.text);
      setState(emo || 'speaking');
      const el = addMsg('johnny', '', emo);
      typewriter(el, text, 26, () => setState('idle'));
      break;
    }
    case 'mode_change':
      document.getElementById('mode-value').textContent = e.mode.toUpperCase();
      break;
    case 'idle': setState('idle'); break;
  }
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
function sendText() {
  const inp  = document.getElementById('text-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  addMsg('user', text, null);
  wsSend({ type: 'user_text', text });
}
function sendQuick(t) {
  addMsg('user', t, null);
  wsSend({ type: 'user_text', text: t });
}

// Init
setState('idle');
</script>
